name: Build

on:
  push:
    branches:
      - main
      - codex/macos12-intel-compat
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - codex/macos12-intel-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Test and Package All Architectures
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift Version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build Debug
        run: swift build

      - name: Package App
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v0.1.27"
          fi
          for ARCHITECTURE in x86_64 arm64 universal; do
            VERSION="$VERSION" ARCHITECTURE="$ARCHITECTURE" ./scripts/package-release.sh
            VERSION="$VERSION" ARCHITECTURE="$ARCHITECTURE" ./scripts/verify-release.sh
          done

      - name: Upload App Archive
        uses: actions/upload-artifact@v7
        with:
          name: Sub2APIStatusBar-macOS
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v8
        with:
          name: Sub2APIStatusBar-macOS
          path: release-assets

      - name: Verify Downloaded Assets
        working-directory: release-assets
        run: |
          for CHECKSUM in *.sha256; do
            sha256sum -c "$CHECKSUM"
          done

      - name: Create GitHub Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./*.zip \
            ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "TokenRouter Monitor $GITHUB_REF_NAME"
