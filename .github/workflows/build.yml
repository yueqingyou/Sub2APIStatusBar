name: Build

on:
  push:
    branches:
      - main
      - codex/macos12-intel-compat
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - codex/macos12-intel-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Test and Package All Architectures
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift Version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build Debug
        run: swift build

      - name: Package App
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v0.1.36"
          fi
          for ARCHITECTURE in x86_64 arm64 universal; do
            VERSION="$VERSION" ARCHITECTURE="$ARCHITECTURE" ./scripts/package-release.sh
            VERSION="$VERSION" ARCHITECTURE="$ARCHITECTURE" ./scripts/verify-release.sh
          done
          VERSION_NUMBER="${VERSION#v}"
          UNIVERSAL_ARCHIVE="Sub2APIStatusBar-$VERSION_NUMBER-macOS-universal.zip"
          COMPATIBILITY_ARCHIVE="Sub2APIStatusBar-$VERSION_NUMBER-compat-macOS.zip"
          cp "dist/$UNIVERSAL_ARCHIVE" "dist/$COMPATIBILITY_ARCHIVE"
          (
            cd dist
            LC_ALL=C shasum -a 256 "$COMPATIBILITY_ARCHIVE" > "$COMPATIBILITY_ARCHIVE.sha256"
          )

      - name: Upload App Archive
        uses: actions/upload-artifact@v7
        with:
          name: Sub2APIStatusBar-macOS
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v8
        with:
          name: Sub2APIStatusBar-macOS
          path: release-assets

      - name: Verify Downloaded Assets
        working-directory: release-assets
        run: |
          for CHECKSUM in *.sha256; do
            sha256sum -c "$CHECKSUM"
          done

      - name: Create Draft GitHub Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./*.zip \
            ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "TokenRouter Monitor $GITHUB_REF_NAME"

      - name: Verify Release Asset Order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMPATIBILITY_ARCHIVE="Sub2APIStatusBar-$VERSION-compat-macOS.zip"
          UNIVERSAL_ARCHIVE="Sub2APIStatusBar-$VERSION-macOS-universal.zip"
          VERIFIED=false
          for ATTEMPT in {1..12}; do
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")"
            if [[ -z "$RELEASE_ID" ]]; then
              printf 'Draft release is not visible yet (attempt %d/12).\n' "$ATTEMPT"
            else
              RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
              FIRST_ZIP="$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].name // ""' <<<"$RELEASE_JSON")"
              ZIP_COUNT="$(jq -r '[.assets[] | select(.name | endswith(".zip"))] | length' <<<"$RELEASE_JSON")"
              ASSET_COUNT="$(jq -r '.assets | length' <<<"$RELEASE_JSON")"
              COMPATIBILITY_DIGEST="$(jq -r --arg name "$COMPATIBILITY_ARCHIVE" \
                '[.assets[] | select(.name == $name)][0].digest // ""' <<<"$RELEASE_JSON")"
              UNIVERSAL_DIGEST="$(jq -r --arg name "$UNIVERSAL_ARCHIVE" \
                '[.assets[] | select(.name == $name)][0].digest // ""' <<<"$RELEASE_JSON")"
              if [[ "$FIRST_ZIP" == "$COMPATIBILITY_ARCHIVE" \
                && "$ZIP_COUNT" == "4" \
                && "$ASSET_COUNT" == "8" \
                && -n "$COMPATIBILITY_DIGEST" \
                && "$COMPATIBILITY_DIGEST" == "$UNIVERSAL_DIGEST" ]]; then
                VERIFIED=true
                break
              fi
              printf 'Release assets not ready (attempt %d/12): first=%s zips=%s assets=%s compat=%s universal=%s\n' \
                "$ATTEMPT" "$FIRST_ZIP" "$ZIP_COUNT" "$ASSET_COUNT" \
                "$COMPATIBILITY_DIGEST" "$UNIVERSAL_DIGEST"
            fi
            if [[ "$ATTEMPT" != "12" ]]; then
              sleep 5
            fi
          done
          [[ "$VERIFIED" == "true" ]]

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
